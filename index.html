<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ねこのスヤァ | 規約・ポリシー</title>
<style>
  :root {
    --cream: #FBF6EA;
    --paper: #FFFDF6;
    --ink: #4A4A55;
    --brown: #8A6F5C;
    --pink: #E8899A;
    --pink-soft: #F2B8C6;
    --line: #C9BFAE;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", "Noto Sans JP", sans-serif;
    line-height: 1.9;
    font-size: 15px;
  }
  .sky {
    background: linear-gradient(170deg, #8D87C4 0%, #B49BCC 45%, #E8B7C4 80%, #F5D9DC 100%);
    border-bottom: 3px solid var(--ink);
    padding: 44px 20px 34px;
    text-align: center;
    overflow: hidden;
  }
  .sky h1 {
    color: #FFFDF6;
    font-size: 26px;
    letter-spacing: 0.12em;
    text-shadow: 0 2px 0 rgba(74,74,85,0.35);
    margin-bottom: 6px;
  }
  .sky p { color: #FBF3E6; font-size: 13px; }
  main {
    max-width: 680px;
    margin: -1px auto 0;
    padding: 28px 20px 40px;
  }
  .card {
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 4px;
    padding: 28px 26px;
  }
  .meta { color: var(--brown); font-size: 13px; margin-bottom: 18px; }
  .lead { margin-bottom: 26px; }
  h2 {
    font-size: 16px;
    margin: 30px 0 10px;
    padding-bottom: 4px;
    border-bottom: 4px solid var(--pink-soft);
    display: inline-block;
  }
  h2:first-of-type { margin-top: 0; }
  ol.clauses { list-style: none; counter-reset: none; }
  ol.sub { padding-left: 1.6em; margin: 4px 0 8px; }
  ol.sub li { list-style: decimal; margin-bottom: 4px; }
  ul.flat { padding-left: 1.4em; margin: 4px 0 8px; }
  ul.flat li { list-style: none; position: relative; margin-bottom: 4px; }
  ul.flat li::before {
    content: "";
    position: absolute; left: -1.1em; top: 0.72em;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--pink-soft); border: 1.5px solid var(--pink);
  }
  section p { margin-bottom: 8px; }
  footer {
    max-width: 680px; margin: 0 auto; padding: 0 20px 48px;
    text-align: center; color: var(--brown); font-size: 13px;
  }
  footer a { color: var(--pink); font-weight: bold; }
  a { color: var(--pink); }
  a:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  @media (max-width: 480px) {
    body { font-size: 14px; }
    .card { padding: 22px 16px; }
  }
</style>
</head>
<body>

<header class="sky">
  <h1>ねこのスヤァ</h1>
  <p>規約・ポリシーのご案内</p>
</header>

<main>
  <div class="card" style="text-align:center;">
    <p class="lead" style="margin-bottom:20px;">スマートフォンアプリ「ねこのスヤァ」に関する文書はこちらです。</p>
    <p style="margin-bottom:14px;"><a href="./terms.html" style="font-size:17px; font-weight:bold;">利用規約</a></p>
    <p><a href="./privacy.html" style="font-size:17px; font-weight:bold;">プライバシーポリシー</a></p>
  </div>
</main>

<footer>
  <p>お問い合わせ: dev.abros.com@gmail.com</p>
  <p>© 2026 Abros</p>
</footer>

</body>
</html>
